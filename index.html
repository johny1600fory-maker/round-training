 let pair2;

 else if(cfg.focus==='back')pair2=[choose(['kb-row','db-row'],'birddog'),choose(['suitcase'],'sideplank')];
 else if(cfg.focus==='legs')pair2=[choose(['split','reverse-lunge'],'split'),choose(cfg.must.quota?['db-rdl','kb-deadlift']:['goblet','squat'],'bridge')];

 if(cfg.effort===1)boxPool=boxPool.filter(id=>id!=='box-tempo');
 if(cfg.focus==='legs')boxPool=['box-exit','box-base','box-defense',...boxPool];
 if(cfg.focus==='shoulders')boxPool=['box-base','box-double','box-flow',...boxPool];
 let rounds=cfg.must.shadow?3:cfg.type==='boxing'?3:['mix','endurance'].includes(cfg.type)?2:0;
 const p={version:2,seed,config:cfg,title:TYPES[cfg.type],created:new Date().toISOString(),notes,edited:false,blocks:[]};
 p.blocks.push(block('warm','Подготовка суставов','warm',[entry('mobility')],1,0,0));
 if(cfg.must.rope)p.blocks.push(block('rope','Скакалка · 10 минут','rope',[entry('rope-basic',{value:180}),entry('rope-boxer',{value:120}),entry('rope-step',{value:120}),entry('rope-basic',{value:180})],1,0,0));
 else if(cfg.gear.includes('rope'))p.blocks.push(block('rope','Скакалка · разогрев','rope',[entry('rope-basic',{value:180})],1,0,0));
 else p.blocks.push(block('warm-legs','Разогрев ног','warm',[entry('footwork',{value:90})],1,0,0));
 if(rounds)p.blocks.push(block('boxing','Бой с тенью · 3 / 1','boxing',Array.from({length:rounds},(_,i)=>entry(boxPool[i%boxPool.length],{value:180})),1,0,60));

 if(cfg.type==='strength')notes.push('С доступными весами это домашняя силовая и силовая выносливость, а не тренировка максимальной силы.');
 if(cfg.effort===3)notes.push('Тяжёлый режим — не гонка за пульсом. Снизь темп или добавь отдых, если исчезают чистые повторения.');

function validPlan(value,registry=EX){

function settings(){openSheet('Настройки',`<div class="tech-tag">РАУНД · ВЕРСИЯ 2.0</div><h2 class="tech-title">Звук, данные<br>и установка.</h2><label class="checkrow"><span>Звуки таймера<small>Гонг и сигналы за 5 секунд до старта.</small></span><input id="sound-setting" type="checkbox" ${state.sound?'checked':''}></label><div class="form-row" style="margin-top:17px"><label for="volume-setting">Громкость сигналов</label><input type="range" id="volume-setting" min="0" max="100" value="${state.volume}"></div><button class="secondary" data-action="test-sound" style="width:100%">${icon('sound')} Проверить звук</button><div class="tech-section"><h3>На iPhone как отдельное приложение</h3><p>Нужна опубликованная HTTPS-версия. В Safari: «Поделиться» → «На экран “Домой”» → включить «Открывать как веб-приложение» → «Добавить».</p></div><div class="callout ${location.protocol==='file:'?'warning':''}">${location.protocol==='file:'?'Сейчас открыт локальный файл, а не опубликованное приложение. Для установки нужен весь PWA-пакет на HTTPS-хостинге. Предпросмотр в «Файлах» может не выполнять JavaScript.':window.isSecureContext?'Защищённое соединение доступно. Можно добавить приложение на главный экран через Safari.':'Эта страница открыта без HTTPS. Установка и офлайн-кэш требуют защищённого адреса.'}<br><span id="offline-status">${'serviceWorker'in navigator&&navigator.serviceWorker.controller?'Офлайн-кэш активен.':'Офлайн-кэш ещё не подтверждён.'}</span></div><div class="tech-section"><h3>Экран и блокировка</h3><p>Приложение запрашивает удержание экрана включённым. Система может отказать. При блокировке, сворачивании или прерывании звука сессия ставится на паузу, а не продолжает раунд молча. На заблокированном iPhone фоновый гонг не гарантируется.</p></div><div class="tech-section"><h3>Сохранность данных</h3><p>${storageOK?'Данные сохраняются локально.':'Браузер не разрешает локальное сохранение.'} Здесь нет синхронизации между устройствами, Apple Health, трекинга пульса или серверного аккаунта. При смене адреса сайта история не переносится сама — используй экспорт / импорт.</p></div><div class="actions"><button class="secondary" data-action="export">Экспорт данных</button><button class="secondary" data-action="import">Импорт данных</button></div><button class="text-button" data-action="sources" style="width:100%;margin-top:15px">Методика и проверенные источники ↗</button>`);}

function editBlock(bi){const b=state.plan?.blocks[bi];if(!b)return;sheetContext={type:'edit',bi};openSheet('Изменить блок',`<div class="form-row"><label for="edit-title">Название блока</label><input id="edit-title" value="${esc(b.title)}" maxlength="80"></div>${b.locked?'<div class="callout">Блок закреплён как 50 + 50. Изменение повторений или кругов изменит эту цель — в плане появится предупреждение.</div>':''}<div class="two-inputs"><div class="form-row"><label for="edit-sets">Кругов</label><input id="edit-sets" type="number" inputmode="numeric" min="1" max="8" value="${b.sets}" ${b.kind==='boxing'?'disabled':''}></div><div class="form-row"><label for="edit-rest">Отдых между кругами, сек</label><input id="edit-rest" type="number" inputmode="numeric" min="0" max="180" value="${b.rest}"></div></div><div class="form-row"><label for="edit-gap">${b.kind==='boxing'?'Отдых между раундами':'Переход между упражнениями'}, сек</label><input id="edit-gap" type="number" inputmode="numeric" min="0" max="120" value="${b.gap}"></div>${b.entries.map((it,i)=>`<div class="edit-entry"><strong>${esc(EX[it.ex].name)}${EX[it.ex].side?' · на сторону':''}</strong><div class="entry-inputs"><input aria-label="Объём ${esc(EX[it.ex].name)}" data-edit-value="${i}" type="number" inputmode="numeric" min="1" max="${it.mode==='time'?900:100}" value="${it.value}"><select aria-label="Единица объёма" data-edit-mode="${i}"><option value="reps" ${it.mode==='reps'?'selected':''}>повторений</option><option value="time" ${it.mode==='time'?'selected':''}>секунд</option></select></div></div>`).join('')}<div class="sheet-error" id="edit-error"></div><button class="primary" data-action="apply-edit">Сохранить изменения</button><div class="actions" style="margin-top:10px"><button class="secondary" data-action="move-block" data-dir="-1">↑ Выше</button><button class="secondary" data-action="move-block" data-dir="1">↓ Ниже</button><button class="text-button danger" data-action="delete-block">Удалить блок</button></div>`);sheetContext={type:'edit',bi};}
function applyEdit(){const ctx=sheetContext;if(ctx?.type!=='edit')return;const b=state.plan.blocks[ctx.bi];const sets=Number($('edit-sets').value),rest=Number($('edit-rest').value),gap=Number($('edit-gap').value);
 if(!Number.isInteger(sets)||sets<1||sets>8||!Number.isFinite(rest)||rest<0||rest>180||!Number.isFinite(gap)||gap<0||gap>120){$('edit-error').textContent='Проверь числа: 1–8 кругов, отдых 0–180 сек, переход 0–120 сек.';return;}
 const entries=b.entries.map((e,i)=>({...e,value:Number(document.querySelector(`[data-edit-value="${i}"]`).value),mode:document.querySelector(`[data-edit-mode="${i}"]`).value}));
 if(entries.some(e=>!Number.isFinite(e.value)||e.value<1||e.value>(e.mode==='time'?900:100)||!Number.isInteger(e.value))){$('edit-error').textContent='Укажи целое число: 1–100 повторов или 1–900 секунд.';return;}
 if(b.kind==='boxing'&&(entries.some(e=>e.mode!=='time'||e.value!==180)||gap!==60)){
  if(!confirm('Это изменит стандартные раунды 3 минуты / 1 минута. Продолжить?'))return;b.title='Бой с тенью · свой интервал';
 }else b.title=$('edit-title').value.trim()||b.title;
 Object.assign(b,{sets,rest,gap,entries});edited();closeSheet();}

function openReplace(bi,ei){const b=state.plan.blocks[bi],old=EX[b.entries[ei].ex];const list=Object.values(EX).filter(e=>e.id!==old.id&&e.pattern===old.pattern&&canUse(e,state.plan.config));sheetContext={type:'replace',bi,ei};openSheet('Заменить упражнение',`<p class="sub">Вместо «${esc(old.name)}» — движение того же типа. Только доступный в плане инвентарь.</p>${libraryRows(list,'choose-replacement')||'<div class="empty">Другого подходящего движения с этим инвентарём пока нет. Можно изменить план или добавить свой блок.</div>'}`);sheetContext={type:'replace',bi,ei};}

function customExercise(){openSheet('Своё упражнение',`<p class="sub">Попадёт в библиотеку и ручное добавление. Генератор не назначает непроверенные пользовательские движения автоматически.</p><div class="form-row"><label for="custom-name">Название</label><input id="custom-name" maxlength="80" placeholder="Например: упражнение от тренера"></div><div class="two-inputs"><div class="form-row"><label for="custom-cat">Раздел</label><select id="custom-cat"><option value="strength">Силовые</option><option value="core">Пресс и корпус</option><option value="conditioning">Выносливость</option><option value="boxing">Бокс</option></select></div><div class="form-row"><label for="custom-pattern">Тип движения</label><select id="custom-pattern">${Object.entries(PATTERN).filter(([k])=>!['warm','cool'].includes(k)).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div></div><div class="two-inputs"><div class="form-row"><label for="custom-value">Объём подхода</label><input type="number" id="custom-value" min="1" max="600" inputmode="numeric" value="10"></div><div class="form-row"><label for="custom-mode">Единица</label><select id="custom-mode"><option value="reps">Повторения</option><option value="time">Секунды</option></select></div></div><div class="form-row"><label for="custom-gear">Инвентарь</label><select id="custom-gear"><option value="">Без инвентаря</option>${Object.entries(EQUIPMENT).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></div><label class="checkrow"><span>Каждая сторона отдельно</span><input id="custom-side" type="checkbox"></label><div class="form-row" style="margin-top:18px"><label for="custom-steps">Как выполнять — каждый шаг с новой строки</label><textarea id="custom-steps" maxlength="2000" placeholder="Исходное положение…&#10;Движение…&#10;Что контролировать…"></textarea></div><div class="sheet-error" id="custom-error"></div><button class="primary" data-action="save-custom">Добавить упражнение</button>`);}
function saveCustom(){const name=$('custom-name').value.trim(),steps=$('custom-steps').value.split('\n').map(s=>s.trim()).filter(Boolean),val=Number($('custom-value').value),mode=$('custom-mode').value;
 if(!name||!steps.length||!Number.isInteger(val)||val<1||val>(mode==='reps'?50:600)){$('custom-error').textContent='Нужны название, инструкция и корректный объём: 1–50 повторов или 1–600 секунд.';return;}
 const gear=$('custom-gear').value,ex=customFrom({id:'custom-'+Date.now().toString(36),name,steps,value:val,mode,cat:$('custom-cat').value,pattern:$('custom-pattern').value,side:$('custom-side').checked,gear:gear?[gear]:[],cue:steps[0]});EX[ex.id]=ex;state.custom.push(ex);persist();closeSheet();view='library';libraryFilter='all';libraryQuery='';render();toast('Упражнение добавлено.');}
function exportData(){const blob=new Blob([JSON.stringify({format:'round-backup',version:2,exported:new Date().toISOString(),...state,session:state.session?{...state.session,steps:undefined,running:false}:null},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='round-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);toast('Резервная копия подготовлена.');}
async function importData(file){if(!file)return;if(file.size>5000000){toast('Файл слишком большой. Максимум 5 МБ.');return;}try{const data=JSON.parse(await file.text());if(data.format!=='round-backup'||data.version!==2)throw Error('Неверный формат');const prepared=prepareState(data);if(!confirm('Заменить текущие планы, историю и настройки данными из резервной копии?'))return;if(state.session)pauseSession();commitState(prepared);persist();closeSheet();render();toast('Данные восстановлены.');}catch(_){toast('Не удалось прочитать резервную копию Раунд v2.');}}
/* Audio: generated locally; no network audio assets. Every scheduled node is
   cancelled on pause so a paused session cannot emit future countdowns. */
const audio={ctx:null,master:null,nodes:new Set(),events:[],
 async unlock(){if(!state.sound)return true;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)throw Error('No Web Audio');if(!this.ctx){this.ctx=new C();this.master=this.ctx.createGain();this.master.connect(this.ctx.destination);this.ctx.addEventListener('statechange',()=>{if(this.ctx.state!=='running'&&state.session?.running&&state.sound)pauseSession('Звук прервался. Проверь громкость и нажми «Продолжить».');});}if(this.ctx.state!=='running')await this.ctx.resume();this.volume();return this.ctx.state==='running';}catch(_){return false;}},
 volume(){if(this.master)this.master.gain.setValueAtTime(state.volume/100*.6,this.ctx.currentTime);},
 tone(freq,dur=.13,amp=.24,delay=0){if(!state.sound||!this.ctx||this.ctx.state!=='running')return;const t=this.ctx.currentTime+Math.max(0,delay),o=this.ctx.createOscillator(),g=this.ctx.createGain();o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(amp,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+.02);this.nodes.add(o);o.onended=()=>{this.nodes.delete(o);o.disconnect();g.disconnect();};},
 beep(n,delay){this.events.push({event:'beep',n,delay});this.tone(940,.11,.23,delay);},
 gong(final=false){this.events.push({event:final?'final':'gong'});for(const d of final?[0,.32,.64]:[0])for(const [f,a,t]of[[510,.25,1.6],[827,.14,1.2],[1315,.08,.9],[1940,.05,.65]])this.tone(f,t,a,d);},
 chime(){this.tone(660,.12,.16);this.tone(880,.15,.12,.12);},
 cancel(){for(const n of this.nodes){try{n.stop();}catch(_){}}this.nodes.clear();}
};
let deadline=0,lastTick=0,lastSave=0,lastPaint=0,wake=null,wakeBusy=false,startBusy=false;
async function requestWake(){if(!state.session?.running||document.hidden||wake||wakeBusy)return;if(!navigator.wakeLock)return;wakeBusy=true;try{const token=await navigator.wakeLock.request('screen');if(!state.session?.running||document.hidden){await token.release();return;}wake=token;token.addEventListener('release',()=>{if(wake===token)wake=null;});}catch(_){}finally{wakeBusy=false;}}
function releaseWake(){const old=wake;wake=null;if(old)old.release().catch(()=>{});}
function curr(){return state.session?.steps[state.session.index];}
function secondsRemaining(){const s=state.session;if(!s)return 0;return s.running&&curr()?.mode==='time'?Math.max(0,(deadline-performance.now())/1000):s.remaining;}
function scheduleSounds(transition=false,previous=null){audio.cancel();const s=state.session,it=curr();if(!s?.running||!state.sound)return;
 if(transition){if(it.kind==='boxing'||previous?.kind==='boxing')audio.gong();else if(it.kind!=='prep')audio.chime();}
 if(it.mode==='time'&&['rest','prep'].includes(it.kind)){const rem=secondsRemaining(),next=s.steps[s.index+1];if(next&&next.kind!=='rest'){for(let n=5;n>=1;n--)if(n<=rem+.025)audio.beep(n,Math.max(0,rem-n));}}
}
function syncElapsed(now=performance.now()){const s=state.session;if(!s?.running)return;const dt=Math.max(0,(now-lastTick)/1000);s.elapsed+=dt;s.stepElapsed+=dt;lastTick=now;if(curr().mode==='time')s.remaining=Math.max(0,(deadline-now)/1000);}
async function startPlan(p){if(startBusy)return;startBusy=true;try{if(state.session&&!confirm('Заменить незавершённую сессию новой? Текущий прогресс не будет записан.'))return;if(state.session)pauseSession();closeSheet();const plan=validPlan(p);if(!plan)throw Error('Некорректный план');const steps=compile(plan);state.session={id:'s-'+Date.now().toString(36),plan,steps,index:0,running:false,remaining:steps[0].seconds,elapsed:0,stepElapsed:0,target:0,logs:{},started:new Date().toISOString(),notice:''};$('player').hidden=false;document.body.style.overflow='hidden';paintPlayer(true);const ok=await audio.unlock();if(!ok&&state.sound){state.session.notice='Звук не включился. Нажми «Продолжить» или выключи звук кнопкой сверху.';paintPlayer(true);persist();return;}runSession(true); }catch(e){toast(e.message||'Не удалось запустить.');}finally{startBusy=false;}}
function runSession(transition=false){const s=state.session;if(!s||s.running)return;s.running=true;s.notice='';lastTick=performance.now();deadline=lastTick+s.remaining*1000;scheduleSounds(transition);requestWake();persist();paintPlayer(true);}
async function resumeSession(){if(!state.session||startBusy)return;startBusy=true;try{$('player').hidden=false;document.body.style.overflow='hidden';paintPlayer(true);const ok=await audio.unlock();if(!ok&&state.sound){state.session.notice='Не удалось включить звук. Проверь разрешения или выключи звук.';paintPlayer(true);return;}runSession(false);}finally{startBusy=false;}}
function pauseSession(reason='На паузе.'){const s=state.session;if(!s)return;if(s.running)syncElapsed();s.running=false;s.notice=reason;audio.cancel();releaseWake();persist();paintPlayer(true);}
function logStep(status){const s=state.session,it=curr();s.logs[s.index]={status,reps:status==='done'&&it.mode==='reps'?s.target:0,elapsed:s.stepElapsed};}
function enterIndex(idx,keepRunning=true,prev=null,base=null){const s=state.session;if(!s)return;if(idx>=s.steps.length){finishSession(true);return;}s.index=idx;s.remaining=s.steps[idx].seconds;s.target=s.steps[idx].reps||0;s.stepElapsed=0;s.running=keepRunning;s.notice='';lastTick=performance.now();deadline=(base??lastTick)+s.remaining*1000;if(base&&base<lastTick){const overdue=(lastTick-base)/1000;s.stepElapsed=overdue;s.remaining=Math.max(0,(deadline-lastTick)/1000);}scheduleSounds(keepRunning,prev);persist();paintPlayer(true);$('announcer').textContent=s.steps[idx].title+(s.steps[idx].info?' · '+s.steps[idx].info:'');}
function completeStep(status='done'){const s=state.session;if(!s)return;syncElapsed();const old=curr(),running=s.running;logStep(status);enterIndex(s.index+1,running,old);}
function skipStep(){if(!state.session)return;completeStep('skipped');}
function previousStep(){const s=state.session;if(!s||s.index<=0)return;syncElapsed();const idx=s.index-1;delete s.logs[idx];delete s.logs[s.index];enterIndex(idx,s.running,null);}
function extraRest(){const s=state.session;if(!s||curr().kind!=='rest')return;syncElapsed();s.remaining+=30;deadline=performance.now()+s.remaining*1000;scheduleSounds(false);persist();paintPlayer(true);}
function playerNextText(){const s=state.session;if(!s)return'';const n=s.steps[s.index+1];if(!n)return'Финиш и сохранение результата';if(n.kind==='rest'){const n2=s.steps.slice(s.index+2).find(x=>x.kind!=='rest');return `${clock(n.seconds)} отдыха${n2?' → '+n2.title:''}`;}return n.title+(n.mode==='reps'?` · ${n.reps} повт.`:` · ${clock(n.seconds)}`);}
function paintPlayer(force=false){const s=state.session,it=curr();if(!s||!it)return;const now=performance.now();if(!force&&now-lastPaint<100)return;lastPaint=now;
 const phase=it.kind==='rest'?'var(--blue)':it.kind==='boxing'?'var(--orange)':it.kind==='core'?'#b9ace1':'var(--accent)';$('player').style.setProperty('--phase',phase);
 $('player-block').textContent=it.block;$('player-step').textContent=`Этап ${s.index+1} / ${s.steps.length}${it.info?' · '+it.info:''}`;
 $('phase-name').textContent=it.kind==='rest'?'Отдых':it.kind==='prep'?'Подготовка':it.kind==='boxing'?`Раунд ${it.round} / ${it.rounds}`:it.kind==='rope'?'Скакалка':it.kind==='cool'?'Заминка':it.kind==='warm'?'Разогрев':it.mode==='reps'?'Силовой подход':'Рабочий интервал';
 const rep=it.mode==='reps';$('clock').classList.toggle('reps',rep);$('clock').textContent=rep?String(s.target):clock(secondsRemaining());
 $('clock-unit').textContent=rep?`повторений${it.side?' · '+it.side:''} · на подход ${clock(s.stepElapsed)}`:(it.side||(!s.running?'На паузе':'Осталось'));
 $('current-ex').textContent=it.title;$('player-cue').textContent=it.cue;
 $('player-tech').hidden=!it.ex;$('player-tech').innerHTML=icon('book')+' Как делать правильно';$('rep-adjust').hidden=!rep;$('rep-label').textContent=`Фактически: ${s.target} / цель ${it.reps}`;
 $('more-rest').hidden=it.kind!=='rest';$('player-next').textContent=playerNextText();$('player-sound').innerHTML=icon(state.sound?'sound':'mute');
 $('player-main').innerHTML=!s.running?icon('play')+' Продолжить':rep?icon('check')+' Подход выполнен':icon('pause')+' Пауза';
 $('player-progress').style.width=`${(s.index/Math.max(1,s.steps.length)*100).toFixed(1)}%`;
 $('player-notice').textContent=s.notice||'';$('player-info').textContent=`Прошло ${clock(s.elapsed)} · ${wake?'Экран удерживается включённым':'Держи экран открытым'}${!storageOK?' · Сохранение недоступно':''}`;
}
function tick(){const s=state.session;if(!s?.running)return;const now=performance.now();if(now-lastTick>3000){pauseSession('Браузер задержал выполнение. Сессия на паузе — продолжи вручную.');return;}syncElapsed(now);if(curr().mode==='time'&&s.remaining<=0){const prev=curr(),end=deadline;logStep('done');enterIndex(s.index+1,true,prev,end);}else paintPlayer();if(now-lastSave>3000){persist();lastSave=now;}}
setInterval(tick,80);
function showSummary(){if(!pendingSummary)return;const h=pendingSummary;openSheet('Результат тренировки',`<div class="tech-tag">${h.complete?'СЕССИЯ ЗАВЕРШЕНА':'ЗАВЕРШЕНО ДОСРОЧНО'}</div><div class="summary-success">${clock(h.elapsed)}</div><p class="sub">Фактическое время без пауз приложения.<br>${h.done} из ${h.total} рабочих этапов отмечены выполненными.</p><div class="quota-badges"><span>Тень ${h.rounds} раундов</span><span>Отжимания ${h.push}</span><span>Приседания ${h.squat}</span><span>Пресс ${h.abs}</span></div><h3>Насколько тяжело было?</h3><p class="hint">1 — почти без усилий. 10 — предел. Можно не оценивать.</p><div class="rating">${Array.from({length:10},(_,i)=>`<button data-action="rate" data-value="${i+1}" class="${selectedRating===i+1?'active':''}">${i+1}</button>`).join('')}</div><div class="form-row"><label for="summary-note">Заметка</label><textarea id="summary-note" maxlength="1000" placeholder="Что получилось, где нужно изменить нагрузку…">${esc(h.note||'')}</textarea></div><button class="primary" data-action="save-summary">Сохранить тренировку</button><p class="hint">Результат уже сохранён без оценки. Закрытие окна не удалит сессию.</p>`);}
function finishSession(complete){const s=state.session;if(!s)return;if(s.running)syncElapsed();s.running=false;audio.cancel();audio.gong(true);releaseWake();const work=s.steps.filter(x=>!['rest','prep'].includes(x.kind));let done=0,push=0,squat=0,abs=0,rounds=0;for(const [idx,l]of Object.entries(s.logs)){const x=s.steps[Number(idx)];if(!x||l?.status!=='done')continue;if(!['rest','prep'].includes(x.kind))done++;if(x.tag==='push')push+=Number(l.reps)||0;if(x.tag==='squat')squat+=Number(l.reps)||0;if(x.tag==='abs')abs+=Number(l.reps)||0;if(x.kind==='boxing'&&x.ex)rounds++;}
 pendingSummary={id:s.id,name:s.plan.title,date:new Date().toISOString(),elapsed:s.elapsed,complete,done,total:work.length,push,squat,abs,rounds,rpe:0,note:'',plan:clone(s.plan)};state.history.unshift(pendingSummary);state.history=state.history.slice(0,200);state.session=null;selectedRating=0;persist();$('player').hidden=true;document.body.style.overflow='';view='history';render();showSummary();}
function roundTimerSheet(){openSheet('Только раунды',`<h2 class="tech-title">3 минуты работы.<br>1 минута отдыха.</h2><p class="sub">Бой с тенью без силовых блоков. 5 секунд подготовки, гонг и обратный отсчёт перед каждым стартом.</p><div class="form-row"><label for="round-count">Количество раундов</label><select id="round-count">${Array.from({length:12},(_,i)=>`<option ${i===2?'selected':''} value="${i+1}">${i+1}</option>`).join('')}</select></div><button class="secondary" style="width:100%;margin-bottom:12px" data-action="test-sound">Проверить звук</button><button class="primary" data-action="start-rounds">${icon('play')} Запустить раунды</button>`);}
function makeRounds(n){return{version:2,title:`Бой с тенью · ${n} раундов`,config:{...clone(state.config),must:{rope:false,shadow:false,quota:false,abs:false}},seed:1,notes:[],created:new Date().toISOString(),blocks:[block('boxing','Бой с тенью · 3 / 1','boxing',Array.from({length:n},(_,i)=>entry(['box-base','box-defense','box-flow','box-exit'][i%4],{value:180})),1,0,60)]};}
function generateUI(usePlan=false){if(state.session&&!confirm('Есть незавершённая сессия. Сбросить её и собрать новую тренировку?'))return;if(state.session){pauseSession();state.session=null;}
 const cfg=usePlan&&state.plan?state.plan.config:state.config;const p=generate(cfg,Date.now());if(p.error){if(view!=='build'){view='build';state.config=clone(cfg);render();}const min=p.minimum?Math.ceil(p.minimum/60):0;const next=[30,45,60,75,90].find(n=>n>=min);$('build-error').innerHTML=`<div class="error" role="alert">${esc(p.error)}${min&&next?`<button class="secondary" style="width:100%;margin-top:12px" data-action="fit-minimum" data-value="${next}">Поставить ${next} минут</button>`:''}</div>`;$('build-error').scrollIntoView({behavior:'smooth',block:'center'});return;}
 state.plan=p;state.config=clone(p.config);persist();view='plan';render();window.scrollTo(0,0);if(!storageOK)toast('Браузер не разрешает сохранять данные.');}
/* Event delegation keeps every view replaceable and keyboard-accessible. */
document.addEventListener('click',async ev=>{
 const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(a==='view'){view=b.dataset.view;render();window.scrollTo(0,0);return;}
 if(a==='config'){const opened=$('advanced-builder')?.open;const k=b.dataset.key;state.config[k]=['minutes','effort'].includes(k)?Number(b.dataset.value):b.dataset.value;persist();renderBuilder();if(opened)$('advanced-builder').open=true;return;}
 if(a==='gear'){const opened=$('advanced-builder')?.open;const g=b.dataset.value;state.config.gear=state.config.gear.includes(g)?state.config.gear.filter(x=>x!==g):[...state.config.gear,g];persist();renderBuilder();if(opened)$('advanced-builder').open=true;return;}
 if(a==='generate'||a==='reroll'){generateUI(a==='reroll');return;}
 if(a==='fit-minimum'){state.config.minutes=Number(b.dataset.value);persist();renderBuilder();generateUI();return;}
 if(a==='settings'){settings();return;}if(a==='close-sheet'){closeSheet();return;}if(a==='tech'){tech(b.dataset.ex);return;}if(a==='sources'){sources();return;}if(a==='how-builder'){howBuilder();return;}
 if(a==='library-filter'){libraryFilter=b.dataset.filter;renderLibrary();return;}
 if(a==='edit-block'){editBlock(Number(b.dataset.index));return;}if(a==='apply-edit'){applyEdit();return;}
 if(a==='move-block'&&sheetContext?.type==='edit'){const i=sheetContext.bi,j=i+Number(b.dataset.dir);if(j<0||j>=state.plan.blocks.length)return;[state.plan.blocks[i],state.plan.blocks[j]]=[state.plan.blocks[j],state.plan.blocks[i]];edited();closeSheet();toast('Порядок изменён. Проверь, что разминка осталась в начале.');return;}
 if(a==='delete-block'&&sheetContext?.type==='edit'){if(state.plan.blocks.length<=1){toast('Нельзя удалить единственный блок.');return;}if(!confirm('Удалить этот блок из плана?'))return;state.plan.blocks.splice(sheetContext.bi,1);edited();closeSheet();return;}
 if(a==='replace'){openReplace(Number(b.dataset.block),Number(b.dataset.entry));return;}
 if(a==='choose-replacement'&&sheetContext?.type==='replace'){const{bi,ei}=sheetContext,ex=EX[b.dataset.ex],old=state.plan.blocks[bi].entries[ei];state.plan.blocks[bi].entries[ei]=entry(ex.id,{mode:ex.mode,value:old.mode===ex.mode?old.value:ex.value});edited();closeSheet();toast('Упражнение заменено, время пересчитано.');return;}
 if(a==='add-block'){addBlockSheet();return;}
 if(a==='choose-add'){const ex=EX[b.dataset.ex],p=state.plan;const blk=block('added-'+Date.now().toString(36),ex.name,ex.cat==='boxing'?'boxing':ex.cat,[entry(ex.id,ex.cat==='boxing'?{value:180,mode:'time'}:{})],ex.cat==='boxing'?1:2,60,ex.cat==='boxing'?60:20);const i=p.blocks.findIndex(x=>x.kind==='cool');p.blocks.splice(i<0?p.blocks.length:i,0,blk);edited();closeSheet();toast('Блок добавлен перед заминкой.');return;}
 if(a==='save-plan'){if(!state.plan)return;const name=prompt('Как назвать тренировку?',`${state.plan.title} · ${minutes(duration(state.plan))} мин`);if(!name?.trim())return;state.favorites.unshift({id:'f-'+Date.now().toString(36),name:name.trim().slice(0,90),plan:clone(state.plan)});state.favorites=state.favorites.slice(0,50);persist();toast('Сохранено в разделе «Мои».');return;}
 if(a==='load-favorite'||a==='repeat-history'){const item=(a==='load-favorite'?state.favorites:state.history).find(x=>x.id===b.dataset.id);if(item){state.plan=clone(item.plan);state.config=clone(item.plan.config);persist();view='plan';render();window.scrollTo(0,0);}return;}
 if(a==='delete-favorite'||a==='delete-history'){if(!confirm('Удалить запись?'))return;const k=a==='delete-favorite'?'favorites':'history';state[k]=state[k].filter(x=>x.id!==b.dataset.id);persist();render();return;}
 if(a==='custom-exercise'){customExercise();return;}if(a==='save-custom'){saveCustom();return;}
 if(a==='export'){exportData();return;}if(a==='import'){$('import-file').click();return;}

 if(a==='start-plan'){await startPlan(state.plan);return;}if(a==='resume-session'){await resumeSession();return;}

 if(a==='leave-player'){pauseSession();$('player').hidden=true;document.body.style.overflow='';render();return;}
 if(a==='player-tech'){const id=curr()?.ex;pauseSession('Техника открыта. После просмотра нажми «Продолжить».');if(id)tech(id);return;}

 if(a==='reps-minus'||a==='reps-plus'){if(state.session){state.session.target=Math.max(0,Math.min(100,state.session.target+(a==='reps-plus'?1:-1)));persist();paintPlayer(true);}return;}
 if(a==='finish-early'){if(!confirm('Завершить сейчас и сохранить выполненную часть?'))return;finishSession(false);return;}
 if(a==='toggle-mute'){state.sound=!state.sound;if(state.sound){const ok=await audio.unlock();if(!ok){state.sound=false;toast('Звук недоступен.');}}if(state.session?.running)scheduleSounds(false);else audio.cancel();persist();paintPlayer(true);return;}
 if(a==='test-sound'){state.sound=true;persist();if($('sound-setting'))$('sound-setting').checked=true;const ok=await audio.unlock();if(ok){audio.cancel();audio.beep(1,0);audio.tone(940,.11,.23,.4);setTimeout(()=>{if(!state.session?.running)audio.gong();},800);toast('Два сигнала и гонг. Проверь громкость iPhone.');}else toast('Звук не запустился. Открой в Safari / опубликованном приложении.');return;}
 if(a==='rate'){selectedRating=Number(b.dataset.value);pendingSummary.note=$('summary-note').value;document.querySelectorAll('.rating button').forEach(x=>x.classList.toggle('active',Number(x.dataset.value)===selectedRating));return;}
 if(a==='save-summary'){if(pendingSummary){pendingSummary.rpe=selectedRating;pendingSummary.note=$('summary-note').value.slice(0,1000);const h=state.history.find(x=>x.id===pendingSummary.id);if(h)Object.assign(h,pendingSummary);persist();pendingSummary=null;}closeSheet();render();toast('Результат сохранён.');return;}
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.must){state.config.must[t.dataset.must]=t.checked;persist();}if(t.id==='sound-setting'){state.sound=t.checked;persist();if(!state.sound)audio.cancel();}if(t.id==='import-file'){importData(t.files[0]);t.value='';}});
